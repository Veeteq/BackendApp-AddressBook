server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8383}

spring:
  application:
    name: addressbook
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
  security:
    enabled: false