openapi: 3.0.0
info:
  title: Address Book API
  version: 1.0.0
  description: A REST API for managing an Address Book.

servers:
  - url: http://localhost:8083/api
    description: Main API server

paths:
  /contacts/{id}:
    get:
      tags:
        - contacts
      summary: Get a single contact by ID
      operationId: getContactById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A contact object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          description: Contact not found

    put:
      tags:
        - contacts
      summary: Update a contact by ID
      operationId: updateContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '200':
          description: Contact updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '404':
          description: Contact not found

    delete:
      tags:
        - contacts
      summary: Delete a contact by ID
      operationId: deleteContact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Contact deleted successfully
        '404':
          description: Contact not found

  /contacts:
    get:
      tags:
        - contacts
      summary: Search contacts by name
      operationId: getContacts
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: A paginated list of contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsPageResponse'

    post:
      tags:
        - contacts
      summary: Create a new contact
      operationId: createContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
      responses:
        '201':
          description: Contact created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'

  /contacts/search:
    get:
      tags:
        - contacts
      summary: Search contacts by name
      operationId: searchContacts
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: A paginated list of contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsPageResponse'

components:
  schemas:
    Contact:
      type: object
      properties:
        id:
          type: integer
          format: int64
        address:
          $ref: '#/components/schemas/Address'
        contactType:
          type: string
          enum: [company, person]
        firstName:
          type: string
        lastName:
          type: string
        companyName:
          type: string            
        displayName:
          type: string
        taxId:
          type: string    
        bankAccountNumber:
          type: string
        tags:
          type: array
          items:
            type: string
          example: ["tag1", "tag2", "tag3"]
      required:
        - contactType
    Address:
      type: object
      properties:
        country:
          type: string
        postcode:
          type: string
        city:
          type: string
        street:
          type: string
      required:
        - country
        - postcode
        - city
        - street

    ContactsPageResponse:
      type: object
      properties:
        totalItems:
          type: integer
          format: int64
          description: Total number of items that match the search criteria
        totalPages:
          type: integer
          description: Total number of pages
        currentPage:
          type: integer
          description: Current page number
        itemsPerPage:
          type: integer
          description: Number of items per page
        items:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
      required:
        - totalItems
        - totalPages
        - currentPage
        - itemsPerPage
        - items
